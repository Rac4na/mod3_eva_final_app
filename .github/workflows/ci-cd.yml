name: CI/CD

# git-flow: se desarrolla en develop (solo CI) y main es la rama de release
# (CI + CD). Los pull requests hacia main se validan antes de fusionar.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_REPO: rac4na/mod3_eva_final
  RESOURCE_GROUP: rg-mod3-eva-final
  APP_NAME: ca-mod3-eva-final

jobs:
  # ---------------------------------------------------------------------------
  # CI — corre en develop, en main y en los PR hacia main.
  #
  # Se construye la misma imagen que irá a producción y las pruebas se ejecutan
  # dentro de ella: así se valida el artefacto real y no un entorno paralelo.
  # ---------------------------------------------------------------------------
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hello-fastapi:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ejecutar pytest dentro del contenedor
        run: docker run --rm hello-fastapi:test pytest -v

  # ---------------------------------------------------------------------------
  # CD — solo cuando main avanza, y solo si el job de pruebas pasó.
  #
  # Publica el artefacto (la imagen etiquetada con el SHA del commit) y crea una
  # revisión nueva de la Container App apuntando a ese tag.
  #
  # Requiere que la infraestructura ya exista: `terraform apply` en el repo
  # mod3_eva_final_infra.
  # ---------------------------------------------------------------------------
  deploy:
    name: Publicar y desplegar
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Los secretos de Docker Hub y Azure viven en este environment: sin esta
    # linea el job no los ve y llegan vacios a las acciones de login.
    environment: dockerhub-publish

    # id-token: write habilita el OIDC con el que azure/login pide un token
    # temporal a Entra ID. Sin esta línea no hay federación posible.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # linux/amd64 explícito: los nodos de Azure Container Apps no ejecutan arm64.
      - name: Publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Autenticarse en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Se despliega por SHA y no por :latest para que cada revisión sea
      # trazable a un commit y el rollback sea el redeploy de un tag anterior.
      - name: Desplegar en Azure Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_REPO:${{ github.sha }}" \
            --output none
          echo "Desplegado $IMAGE_REPO:${{ github.sha }}"

      - name: Verificar el endpoint /hello
        run: |
          FQDN=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          URL="https://$FQDN/hello"
          echo "Probando $URL"

          # La revisión nueva tarda unos segundos en empezar a recibir tráfico.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL"; then
              echo ""
              echo "Despliegue verificado."
              exit 0
            fi
            echo "Intento $i sin respuesta; reintentando en 10s..."
            sleep 10
          done

          echo "El endpoint no respondió tras 2 minutos."
          exit 1

      - name: Resumen del despliegue
        if: success()
        run: |
          FQDN=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          {
            echo "### Despliegue correcto"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Imagen | \`$IMAGE_REPO:${{ github.sha }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| URL | https://$FQDN/hello |"
          } >> "$GITHUB_STEP_SUMMARY"
